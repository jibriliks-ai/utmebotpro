services:
    - type: web
    name: utme-success-bot-v17-3
    env: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
            - key: BOT_TOKEN
        sync: false
            - key: BOT_USERNAME
        sync: false
        value: YourBot
            - key: ALOC_ACCESS_TOKEN
        sync: false
            - key: PAYMENT_URL
        sync: false
            - key: ADMIN_ID
        sync: false
            - key: PREMIUM_PRICE
        value: 2000
            - key: FREE_MOCK_QS_DAILY
        value: 5
            - key: FREE_TUTOR_PER_DAY
        value: 2
            - key: REFERRAL_REQUIRED
        value: 3
            - key: REFERRAL_REWARD_DAYS
        value: 7
            - key: FLW_PUBLIC_KEY
        sync: false
            - key: FLW_SECRET_KEY
        sync: false
            - key: FLW_SECRET_HASH
        value: utme_webhook_hash_123
            - key: PAYSTACK_PUBLIC_KEY
        sync: false
            - key: PAYSTACK_SECRET_KEY
        sync: false
