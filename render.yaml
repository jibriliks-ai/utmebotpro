services:
  - type: web
    name: utme-success-bot-v17
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ALOC_ACCESS_TOKEN
        sync: false
      - key: PAYMENT_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
